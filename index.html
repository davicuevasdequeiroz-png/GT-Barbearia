<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <title>GT Barbearia | Qualidade & Estilo</title>
  <meta name="description"

  <!-- Google Fonts: Bebas Neue + Oswald + Inter -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <!-- BARBERS SHOWCASE -->
    <div id="barbers-container">

      <!-- YURI — LEFT -->
      <div class="barber-card" id="barber-yuri" data-pos="left">
        <div class="barber-outline"></div>
        <div class="barber-img-wrap">
          <img src="essencial/yuri.png" alt="Yuri Maximo" class="barber-img" />
        </div>
        <div class="barber-info">
          <span class="barber-firstname">YURI</span>
          <span class="barber-lastname">MAXIMO</span>
          <span class="barber-instagram">@yuriwm_barber</span>
        </div>
      </div>

      <!-- GUILHERME — CENTER -->
      <div class="barber-card center" id="barber-guilherme" data-pos="center">
        <div class="barber-outline"></div>
        <div class="barber-img-wrap">
          <img src="essencial/gulherme.png" alt="Guilherme Teixeira" class="barber-img" />
        </div>
        <div class="barber-info">
          <span class="barber-firstname">GUILHERME</span>
          <span class="barber-lastname">TEIXEIRA</span>
          <span class="barber-instagram">@_guilhermeteixeira16__</span>
        </div>
      </div>

      <!-- ZIDANE — RIGHT -->
      <div class="barber-card" id="barber-zidane" data-pos="right">
        <div class="barber-outline"></div>
        <div class="barber-img-wrap">
          <img src="essencial/zidane.png" alt="Zidane Trindade" class="barber-img" />
        </div>
        <div class="barber-info">
          <span class="barber-firstname">ZIDANE</span>
          <span class="barber-lastname">TRINDADE</span>
          <span class="barber-instagram">@zidanebarbeiro_</span>
        </div>
      </div>

    </div>
    <!-- BOTTOM GRADIENT OVERLAY -->
    <div id="hero-bottom-gradient"></div>

  </section>

  <script src="main.js"></script>

</html>
